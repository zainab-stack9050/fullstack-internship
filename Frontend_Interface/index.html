<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <h1>Task Manager</h1>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a new task..." required>
      <button type="submit">Add</button>
    </form>
  </header>

  <nav class="filter-nav">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </nav>

  <main class="content-grid">
    <aside class="sidebar">
      <h2>Stats</h2>
      <div class="progress-ring" id="progress-ring">
        <span id="progress-percent">0%</span>
      </div>
      <p id="task-count">0 tasks left</p>
      <div class="stats-breakdown">
        <div class="stat-row">
          <span class="stat-dot active-dot"></span>
          <span>Active</span>
          <strong id="active-count">0</strong>
        </div>
        <div class="stat-row">
          <span class="stat-dot completed-dot"></span>
          <span>Completed</span>
          <strong id="completed-count">0</strong>
        </div>
      </div>
    </aside>

    <section class="task-list" aria-label="Task list">
      <!-- Tasks will be added here by JavaScript -->
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Task Manager — Built by Zainab</p>
  </footer>

  <div id="confetti-container"></div>

  <script src="script.js"></script>
</body>
</html>
